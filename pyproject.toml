[project]
name = "weekly-report"
version = "0.2.0"
description = "Weekly development reports from Git history, driven by agent skills"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gitpython>=3.1.44",
    "pydantic>=2.11.5",
    "pyyaml>=6.0.2",
]

[project.scripts]
weekly-report = "weekly_report.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weekly_report"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pyright>=1.1.406",
    "ruff>=0.14.0",
]

[tool.ruff]
exclude = [".git", ".venv", "migrations"]
line-length = 120
# Not py313: requires-python is >=3.12, and a higher target lets ruff rewrite code into
# syntax this project cannot run.
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["F403", "E402"]
"__init__.py" = ["F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["weekly_report"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --disable-warnings"
markers = [
    "integration: marks tests that run against a real git repository",
]
