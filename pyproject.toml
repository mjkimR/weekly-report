[project]
name = "weekly-report-prompt"
version = "0.1.0"
description = "Generate prompts for LLM to create weekly development reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gitpython>=3.1.44",
    "pydantic>=2.11.5",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "tiktoken>=0.9.0",
]

[project.scripts]
weekly-report-prompt = "weekly_report_prompt.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weekly_report_prompt"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pyright>=1.1.406",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py312"

[tool.pyright]
include = ["weekly_report_prompt", "setup_conf.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --disable-warnings"
markers = [
    "integration: marks tests that run against a real git repository",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests",
]
